services:
  - type: web
    name: cybercrime-colombia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ANALYST_EMAILS
        sync: false
      - key: BEHIND_PROXY
        value: "1"
