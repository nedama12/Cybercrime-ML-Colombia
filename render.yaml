# Render Blueprint: web service + managed PostgreSQL.
# Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: cybercrime-analytics-colombia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # init-db only creates missing tables, so it is safe on every start.
    startCommand: flask --app app init-db && gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: BEHIND_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: cybercrime-db
          property: connectionString

databases:
  - name: cybercrime-db
    plan: free
    databaseName: cybercrime
    user: cybercrime
