{% extends "base.html" %}
{% block title %}{{ code }} | {{ project.short_title }}{% endblock %}
{% block content %}
<div class="container page">
    <div class="panel form-card">
        <p class="eyebrow">Error {{ code }}</p>
        <h1 class="form-title">{{ title }}</h1>
        <p class="muted">{{ message }}</p>
        <div class="form-actions">
            <a class="button button-primary" href="{{ url_for('docs.home') }}">Go to the home page</a>
            {% if current_user.is_authenticated %}<a class="button button-secondary" href="{{ url_for('account.dashboard') }}">Dashboard</a>{% endif %}
        </div>
    </div>
</div>
{% endblock %}
